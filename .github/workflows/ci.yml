name: CI Pipeline

on:
  push:
    branches: [ main, sewmini ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install server dependencies
        run: npm install
        working-directory: server
      - name: Run server tests
        run: npm test
        working-directory: server
        env:
          MONGODB_URI: mongodb://localhost:27017/testdb
          JWT_SECRET: test_secret_key
          NODE_ENV: test

  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install client dependencies
        run: npm install --legacy-peer-deps
        working-directory: syncboard-client
      - name: Run client tests
        run: npm test
        working-directory: syncboard-client
        env:
          CI: true